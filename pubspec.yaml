name: nomnom
description: "nomnom — type what you ate, get the macros."
publish_to: 'none'
version: 2.6.0+8

environment:
  sdk: ^3.12.2

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.0
  health: ^13.3.2
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0
  home_widget: ^0.10.0
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  lucide_icons_flutter: ^3.1.20
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/data/dishes/

  fonts:
    - family: Clash
      fonts:
        - asset: assets/fonts/ClashGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/ClashGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/ClashGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/ClashGrotesk-Semibold.ttf
          weight: 600
        - asset: assets/fonts/ClashGrotesk-Bold.ttf
          weight: 700
    - family: Instrument Serif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#F4F1EA"
  adaptive_icon_foreground: assets/icon/foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F4F1EA"
  image: assets/icon/splash.png
  android_12:
    color: "#F4F1EA"
    image: assets/icon/foreground.png
  web: false
